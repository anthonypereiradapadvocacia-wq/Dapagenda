<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%230f172a%27/%3E%3Ctext x=%2732%27 y=%2741%27 text-anchor=%27middle%27 font-family=%27Arial,sans-serif%27 font-size=%2724%27 font-weight=%27bold%27 fill=%27white%27%3EDAP%3C/text%3E%3C/svg%3E">
<title>Agenda · Durão &amp; Almeida, Pontes - Advogados Associados</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--ink:#18263B;--muted:#5B6678;--line:#E1E4EA;--line2:#EEF0F4;--accent:#7A1F2B;--now:#D93025;
  --btn-bg:#7A1F2B;--btn-ink:#FFFFFF;
  --interno-bg:#E8EBF0;--interno-bd:#5B6678;--cliente-bg:#E0EBF8;--cliente-bd:#2E5E9E;
  --audiencia-bg:#F4E3E6;--audiencia-bd:#7A1F2B;--prazo-bg:#FBEED3;--prazo-bd:#B26A00;
  --serif:"Spectral",Georgia,serif;--sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101722;--surface:#182233;--ink:#E8ECF3;--muted:#9AA6B8;--line:#2A364B;--line2:#222D40;--accent:#E58A96;--now:#FF6B5E;
    --btn-bg:#E58A96;--btn-ink:#2A0E13;
    --interno-bg:#263247;--interno-bd:#9AA6B8;--cliente-bg:#1B3556;--cliente-bd:#6FA3E6;
    --audiencia-bg:#46242C;--audiencia-bd:#E58A96;--prazo-bg:#4A3612;--prazo-bd:#F0B04D;
  }
}
:root[data-theme="dark"]{
  --bg:#101722;--surface:#182233;--ink:#E8ECF3;--muted:#9AA6B8;--line:#2A364B;--line2:#222D40;--accent:#E58A96;--now:#FF6B5E;
  --btn-bg:#E58A96;--btn-ink:#2A0E13;
  --interno-bg:#263247;--interno-bd:#9AA6B8;--cliente-bg:#1B3556;--cliente-bd:#6FA3E6;
  --audiencia-bg:#46242C;--audiencia-bd:#E58A96;--prazo-bg:#4A3612;--prazo-bd:#F0B04D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-family:var(--serif);font-size:clamp(24px,4vw,32px);line-height:1.1;margin:0}
.date{margin:4px 0 0;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
button{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
button.danger{color:var(--now)}
.nav{display:flex;gap:4px;align-items:center}
.nav input{width:auto}
.stats{color:var(--muted);font-size:14px}
.stats b{color:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border-left:4px solid}
.cal-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.cal{display:grid;grid-template-columns:56px 1fr}
.head{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);padding:10px;border-left:1px solid var(--line)}
.head.corner{border-left:0}
.head strong{display:block;font-size:14px}
.head span{font-size:12.5px;color:var(--muted)}
.times{position:relative}
.times div{position:absolute;right:8px;font-size:12px;color:var(--muted);transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--line);cursor:cell;
  background-image:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent var(--h)),
  repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--h)/2 - 1px),var(--line2) calc(var(--h)/2 - 1px),var(--line2) calc(var(--h)/2),transparent calc(var(--h)/2),transparent var(--h))}
.lunch{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px);opacity:.7;pointer-events:none}
.ev{position:absolute;text-align:left;padding:3px 8px;border-radius:6px;border:0;border-left:4px solid;overflow:hidden;display:block;font-size:13px;line-height:1.25;cursor:pointer}
.ev[data-type="interno"]{background:var(--interno-bg);border-color:var(--interno-bd)}
.ev[data-type="cliente"]{background:var(--cliente-bg);border-color:var(--cliente-bd)}
.ev[data-type="audiencia"]{background:var(--audiencia-bg);border-color:var(--audiencia-bd)}
.ev[data-type="prazo"]{background:var(--prazo-bg);border-color:var(--prazo-bd)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{opacity:.5}.ev.done b{text-decoration:line-through}
.now{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.empty{grid-column:1/-1;padding:48px 20px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 14px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:20px;width:calc(100% - 24px);max-width:520px;max-height:calc(100% - 24px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{font-family:var(--serif);font-size:22px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chks{display:flex;flex-wrap:wrap;gap:6px 16px}
.chks label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:14px}
.chks input{width:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:flex-end}
.acts .sp{flex:1}
.aviso{margin-top:10px;font-size:13.5px;color:var(--prazo-bd);min-height:0}
ul.l{list-style:none;margin:0 0 6px;padding:0}
ul.l li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
ul.l span{color:var(--muted);font-size:13.5px;display:block}
.hint{color:var(--muted);font-size:14px;margin:0 0 8px}
footer{margin-top:16px;color:var(--muted);font-size:13px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
@media print{
  body{background:#fff;color:#000}
  .bar,header .stats,footer,dialog{display:none!important}
  .cal-scroll{overflow:visible;border:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Agenda · Durão &amp; Almeida, Pontes - Advogados Associados</h1>
      <p class="date" id="data"></p>
    </div>
    <div class="stats" aria-live="polite"><b id="total">0</b> reuniões · <b id="feitas">0</b> concluídas</div>
  </header>

  <div class="bar">
    <div class="nav">
      <button type="button" id="prev" aria-label="Dia anterior">‹</button>
      <button type="button" id="hoje">Hoje</button>
      <button type="button" id="next" aria-label="Próximo dia">›</button>
      <input type="date" id="dia" aria-label="Escolher data">
    </div>
    <span class="sp"></span>
    <button type="button" id="bSol">Solicitações <b id="nSol"></b></button>
    <button type="button" id="bAdv">Advogados</button>
    <button type="button" id="bCli">Clientes</button>
    <button type="button" id="bNova" class="primary">Nova reunião</button>
    <button type="button" onclick="window.print()">Imprimir</button>
    <button type="button" id="bSair" style="display:none">Sair</button>
  </div>

  <div class="legend">
    <span><i style="border-color:var(--interno-bd);background:var(--interno-bg)"></i>Interna</span>
    <span><i style="border-color:var(--cliente-bd);background:var(--cliente-bg)"></i>Cliente</span>
    <span><i style="border-color:var(--audiencia-bd);background:var(--audiencia-bg)"></i>Audiência</span>
    <span><i style="border-color:var(--prazo-bd);background:var(--prazo-bg)"></i>Prazo fatal</span>
  </div>

  <div class="cal-scroll"><div class="cal" id="cal"><div class="empty">Carregando…</div></div></div>
  <footer id="modo"></footer>
</div>

<dialog id="dLogin">
  <h2>Entrar</h2>
  <form id="fLogin">
    <label for="lMail">E-mail</label><input id="lMail" type="email" required autocomplete="username">
    <label for="lSenha">Senha</label><input id="lSenha" type="password" required autocomplete="current-password">
    <p class="aviso" id="lErro"></p>
    <div class="acts"><button class="primary" type="submit">Entrar</button></div>
  </form>
</dialog>

<dialog id="dSol">
  <h2>Solicitações de reunião</h2>
  <ul class="l" id="lSol"></ul>
  <div class="acts"><button type="button" data-close>Fechar</button></div>
</dialog>

<dialog id="dAdv">
  <h2>Advogados</h2>
  <ul class="l" id="lAdv"></ul>
  <p class="aviso" id="mAdv"></p>
  <form id="fAdv">
    <label for="aNome">Nome</label><input id="aNome" required autocomplete="off">
    <div class="row" style="grid-template-columns:2fr 1fr">
      <div><label for="aArea">Área de atuação</label><input id="aArea" autocomplete="off" placeholder="Ex.: Trabalhista"></div>
      <div><label for="aOab">OAB</label><input id="aOab" autocomplete="off" placeholder="Opcional"></div>
    </div>
    <div class="acts"><button type="button" data-close>Fechar</button><button class="primary" type="submit">Adicionar advogado</button></div>
  </form>
</dialog>

<dialog id="dCli">
  <h2>Clientes</h2>
  <ul class="l" id="lCli"></ul>
  <form id="fCli">
    <label for="cNome">Nome ou razão social</label><input id="cNome" required autocomplete="off">
    <div class="row" style="grid-template-columns:1fr 1fr">
      <div><label for="cTel">Telefone</label><input id="cTel" type="tel" autocomplete="off"></div>
      <div><label for="cMail">E-mail</label><input id="cMail" type="email" autocomplete="off"></div>
    </div>
    <div class="acts"><button type="button" data-close>Fechar</button><button class="primary" type="submit">Adicionar cliente</button></div>
  </form>
</dialog>

<dialog id="dReu">
  <h2 id="tReu">Nova reunião</h2>
  <form id="fReu">
    <label for="rCli">Cliente</label>
    <div style="display:flex;gap:8px"><select id="rCli" required></select><button type="button" id="rNovoCli">Novo</button></div>
    <label for="rAssunto">Assunto</label><input id="rAssunto" required autocomplete="off" placeholder="Ex.: Revisão de contrato">
    <div class="row">
      <div><label for="rData">Data</label><input id="rData" type="date" required></div>
      <div><label for="rIni">Início</label><select id="rIni"></select></div>
      <div><label for="rDur">Duração</label><select id="rDur"></select></div>
    </div>
    <div class="row" style="grid-template-columns:1fr 2fr">
      <div><label for="rTipo">Tipo</label><select id="rTipo"><option value="cliente">Cliente</option><option value="interno">Interna</option><option value="audiencia">Audiência</option><option value="prazo">Prazo fatal</option></select></div>
      <div><label for="rLocal">Local ou formato</label><input id="rLocal" autocomplete="off" placeholder="Sala 1, videoconferência…"></div>
    </div>
    <label>Advogados</label><div class="chks" id="rAdvs"></div>
    <label for="rPauta">Pauta</label><textarea id="rPauta" placeholder="Um assunto por linha"></textarea>
    <p class="aviso" id="rAviso"></p>
    <div class="acts">
      <button type="button" id="rExcluir" class="danger">Excluir</button>
      <button type="button" id="rFeito">Marcar como concluída</button>
      <span class="sp"></span>
      <button type="button" data-close>Cancelar</button>
      <button class="primary" type="submit">Salvar</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var H=80,START=8,END=18;
  var NAMES={adv:"advogados",cli:"clientes",reu:"reunioes",sol:"solicitacoes"};
  var S={adv:[],cli:[],reu:[],sol:[]}, db=null, editId=null, cur=iso(new Date());
  var TIPOS={interno:"Interna",cliente:"Cliente",audiencia:"Audiência",prazo:"Prazo fatal"};
  function $(i){return document.getElementById(i);}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  function pad(n){return (n<10?"0":"")+n;}
  function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function mins(t){var p=String(t).split(":");return (+p[0])*60+(+p[1]);}
  function hhmm(m){return pad(Math.floor(m/60))+":"+pad(m%60);}
  function byNome(a,b){return String(a.nome).localeCompare(String(b.nome),"pt-BR");}
  function find(k,id){for(var i=0;i<S[k].length;i++)if(S[k][i].id===id)return S[k][i];return null;}
  function shift(n){var d=new Date(cur+"T12:00:00");d.setDate(d.getDate()+n);cur=iso(d);render();}

  /* ---------- armazenamento (Supabase) ---------- */
  var SUPABASE_URL="https://wrbqineebyybytthwjyt.supabase.co";
  var SUPABASE_ANON_KEY="sb_publishable_BDE5SPULJZwzmkPDkjRgLg_me9V9S3G";
  var configurado=SUPABASE_URL.indexOf("COLE_AQUI")!==0;
  var sb=configurado?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
  function erro(m,r){alert(m+": "+r.error.message);}
  function toRow(k,x){
    if(k==="adv")return {nome:x.nome,area:x.area,oab:x.oab};
    if(k==="cli")return {nome:x.nome,tel:x.tel,mail:x.mail};
    return {data:x.data,ini:x.ini,dur:x.dur,cliente_id:x.clienteId||null,assunto:x.assunto,tipo:x.tipo,local:x.local,pauta:x.pauta,feito:!!x.feito,adv:x.adv};
  }
  function fromRow(k,r){
    if(k!=="reu")return r;
    return {id:r.id,data:r.data,ini:String(r.ini).slice(0,5),dur:r.dur,clienteId:r.cliente_id,assunto:r.assunto,tipo:r.tipo,local:r.local,pauta:r.pauta,feito:r.feito,adv:r.adv||[]};
  }
  function load(k){
    return sb.from(NAMES[k]).select("*").then(function(res){
      if(res.error){erro("Não foi possível carregar",res);return;}
      S[k]=res.data.map(function(r){return fromRow(k,r);});render();
    });
  }
  function save(k,item){
    var t=sb.from(NAMES[k]);
    var q=item.id?t.update(toRow(k,item)).eq("id",item.id):t.insert(toRow(k,item));
    q.then(function(res){if(res.error)erro("Não foi possível salvar",res);return load(k);});
  }
  function del(k,id){
    sb.from(NAMES[k]).delete().eq("id",id).then(function(res){if(res.error)erro("Não foi possível remover",res);return load(k);});
  }
  function subscribe(){
    Object.keys(NAMES).forEach(function(k){
      sb.channel("rt-"+k).on("postgres_changes",{event:"*",schema:"public",table:NAMES[k]},function(){load(k);}).subscribe();
    });
  }

  /* ---------- calendário ---------- */
  function render(){
    var d=new Date(cur+"T12:00:00"),t=d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    $("data").textContent=t.charAt(0).toUpperCase()+t.slice(1);
    $("dia").value=cur;
    var cal=$("cal"),advs=S.adv.slice().sort(byNome);
    cal.textContent="";
    var dia=S.reu.filter(function(r){return r.data===cur;});
    $("total").textContent=dia.length;
    $("feitas").textContent=dia.filter(function(r){return r.feito;}).length;
    if(!advs.length){
      cal.style.gridTemplateColumns="1fr";cal.style.minWidth="0";
      var e=el("div","empty");e.appendChild(el("p",null,"Nenhum advogado cadastrado. Cada advogado vira uma coluna da agenda."));
      var b=el("button","primary","Cadastrar advogado");b.type="button";b.onclick=function(){abrirAdv();};
      e.appendChild(b);cal.appendChild(e);
    }else{
      cal.style.gridTemplateColumns="56px repeat("+advs.length+",minmax(190px,1fr))";
      cal.style.minWidth=(56+advs.length*190)+"px";
      var total=(END-START)*H;
      cal.appendChild(el("div","head corner"));
      advs.forEach(function(a){
        var h=el("div","head");h.appendChild(el("strong",null,a.nome));
        var sub=[a.area,a.oab?"OAB "+a.oab:""].filter(Boolean).join(" · ");
        if(sub)h.appendChild(el("span",null,sub));cal.appendChild(h);
      });
      var tm=el("div","times");tm.style.height=total+"px";
      for(var h=START;h<=END;h++){var l=el("div",null,pad(h)+":00");l.style.top=((h-START)*H)+"px";tm.appendChild(l);}
      cal.appendChild(tm);
      var now=new Date(),nm=now.getHours()*60+now.getMinutes();
      advs.forEach(function(a){
        var col=el("div","col");col.style.height=total+"px";col.style.setProperty("--h",H+"px");
        var lu=el("div","lunch");lu.style.top=((12.5-START)*H)+"px";lu.style.height=H+"px";col.appendChild(lu);
        col.addEventListener("click",function(e){
          if(e.target!==col&&e.target!==lu)return;
          var m=START*60+Math.floor(e.offsetY/(H/2))*30;
          abrirReu(null,{adv:[a.id],ini:hhmm(Math.min(m,END*60-30))});
        });
        var items=dia.filter(function(r){return (r.adv||[]).indexOf(a.id)>-1;}).sort(function(x,y){return mins(x.ini)-mins(y.ini);});
        items.forEach(function(r){
          var s=mins(r.ini),dur=+r.dur||30,e=s+dur;
          var ov=items.filter(function(o){var os=mins(o.ini),oe=os+(+o.dur||30);return os<e&&oe>s;});
          var lane=ov.indexOf(r),n=ov.length;
          var c=find("cli",r.clienteId),cn=c?c.nome:"(cliente removido)";
          var b=el("button","ev"+(r.feito?" done":""));b.type="button";b.dataset.type=r.tipo||"cliente";
          b.style.top=((s-START*60)/60*H)+"px";b.style.height=(dur/60*H-2)+"px";
          b.style.left="calc("+(lane*100/n)+"% + 3px)";b.style.width="calc("+(100/n)+"% - 6px)";
          if(dur<=30){b.appendChild(el("b",null,r.ini+" "+cn));}
          else{b.appendChild(el("b",null,cn));b.appendChild(el("small",null,r.ini+"–"+hhmm(e)+" · "+r.assunto));}
          b.title=cn+" · "+r.assunto+" ("+r.ini+"–"+hhmm(e)+")";
          b.addEventListener("click",function(ev){ev.stopPropagation();abrirReu(r);});
          col.appendChild(b);
        });
        if(cur===iso(now)&&nm>=START*60&&nm<=END*60){var nl=el("div","now");nl.style.top=((nm-START*60)/60*H)+"px";col.appendChild(nl);}
        cal.appendChild(col);
      });
    }
    var np=S.sol.filter(function(x){return x.status==="pendente";}).length;
    $("nSol").textContent=np?"("+np+")":"";
    if($("dSol").open)listSol();
    if($("dAdv").open)listAdv();
    if($("dCli").open)listCli();
    if($("dReu").open)refreshReu();
  }

  /* ---------- advogados e clientes ---------- */
  function confirmar(btn,txt,fn){
    var orig=btn.textContent,t;
    btn.onclick=function(){
      if(btn.dataset.sure){fn();return;}
      btn.dataset.sure="1";btn.textContent=txt;
      t=setTimeout(function(){delete btn.dataset.sure;btn.textContent=orig;},3000);
    };
  }
  function listAdv(){
    var u=$("lAdv");u.textContent="";
    var l=S.adv.slice().sort(byNome);
    if(!l.length)u.appendChild(el("li",null,"Nenhum advogado ainda."));
    l.forEach(function(a){
      var li=el("li"),d=el("div");d.appendChild(el("strong",null,a.nome));
      var sub=[a.area,a.oab?"OAB "+a.oab:""].filter(Boolean).join(" · ");
      if(sub)d.appendChild(el("span",null,sub));
      var b=el("button","danger","Remover");b.type="button";
      confirmar(b,"Confirmar",function(){
        var n=S.reu.filter(function(r){return (r.adv||[]).indexOf(a.id)>-1;}).length;
        if(n){$("mAdv").textContent=a.nome+" tem "+n+" reunião(ões) agendada(s). Exclua ou reatribua antes de remover.";delete b.dataset.sure;b.textContent="Remover";return;}
        $("mAdv").textContent="";del("adv",a.id);
      });
      li.appendChild(d);li.appendChild(b);u.appendChild(li);
    });
  }
  function listCli(){
    var u=$("lCli");u.textContent="";
    var l=S.cli.slice().sort(byNome);
    if(!l.length)u.appendChild(el("li",null,"Nenhum cliente ainda."));
    l.forEach(function(c){
      var li=el("li"),d=el("div");d.appendChild(el("strong",null,c.nome));
      var sub=[c.tel,c.mail].filter(Boolean).join(" · ");
      if(sub)d.appendChild(el("span",null,sub));
      var b=el("button","danger","Remover");b.type="button";
      confirmar(b,"Confirmar",function(){del("cli",c.id);});
      li.appendChild(d);li.appendChild(b);u.appendChild(li);
    });
  }
  function abrirAdv(){$("mAdv").textContent="";listAdv();$("dAdv").showModal();}
  function abrirCli(){listCli();$("dCli").showModal();}
  $("fAdv").addEventListener("submit",function(e){
    e.preventDefault();
    save("adv",{nome:$("aNome").value.trim(),area:$("aArea").value.trim(),oab:$("aOab").value.trim()});
    this.reset();$("aNome").focus();
  });
  $("fCli").addEventListener("submit",function(e){
    e.preventDefault();
    save("cli",{nome:$("cNome").value.trim(),tel:$("cTel").value.trim(),mail:$("cMail").value.trim()});
    this.reset();$("cNome").focus();
  });

  /* ---------- solicitações dos clientes ---------- */
  function listSol(){
    var u=$("lSol");u.textContent="";
    var l=S.sol.filter(function(x){return x.status==="pendente";}).sort(function(a,b){return (a.data+a.ini).localeCompare(b.data+b.ini);});
    if(!l.length)u.appendChild(el("li",null,"Nenhuma solicitação pendente."));
    l.forEach(function(x){
      var a=find("adv",x.advogado_id),li=el("li"),d=el("div");
      d.appendChild(el("strong",null,x.nome));
      d.appendChild(el("span",null,x.data.split("-").reverse().join("/")+" às "+String(x.ini).slice(0,5)+" · "+(a?a.nome:"advogado removido")));
      d.appendChild(el("span",null,x.assunto));
      d.appendChild(el("span",null,[x.tel,x.mail].join(" · ")));
      var b=el("div");b.style.cssText="display:flex;gap:6px";
      var ok=el("button","primary","Aceitar");ok.type="button";ok.onclick=function(){aceitar(x);};
      var no=el("button","danger","Recusar");no.type="button";confirmar(no,"Confirmar",function(){recusar(x);});
      b.appendChild(ok);b.appendChild(no);li.appendChild(d);li.appendChild(b);u.appendChild(li);
    });
  }
  function aceitar(x){
    // A janela é aberta no clique para evitar bloqueio de pop-up; o WhatsApp
    // só é aberto depois que a solicitação for aceita e a reunião for criada.
    var wa=window.open("about:blank","_blank");
    var ex=S.cli.filter(function(c){return c.mail&&c.mail.toLowerCase()===x.mail.toLowerCase();})[0];
    var cp=ex?Promise.resolve(ex.id):sb.from("clientes").insert({nome:x.nome,tel:x.tel,mail:x.mail}).select("id").single().then(function(r){if(r.error)throw r.error;return r.data.id;});
    cp.then(function(cid){
      return sb.from("reunioes").insert({data:x.data,ini:String(x.ini).slice(0,5),dur:x.dur,cliente_id:cid,assunto:x.assunto,tipo:"cliente",local:"",pauta:"",feito:false,adv:[x.advogado_id]});
    }).then(function(r){
      if(r.error)throw r.error;
      return sb.from("solicitacoes").update({status:"aceita"}).eq("id",x.id);
    }).then(function(r){
      if(r&&r.error)throw r.error;
      ["cli","reu","sol"].forEach(load);
      var tel=String(x.tel||"").replace(/\\D/g,"");
      if(tel.length===10||tel.length===11)tel="55"+tel;
      if(!tel){
        if(wa)wa.close();
        alert("Solicitação aceita, mas o telefone do cliente está vazio. Entre em contato manualmente.");
        return;
      }
      var data=x.data.split("-").reverse().join("/");
      var texto="Olá, "+x.nome+"! Sua solicitação de reunião para "+data+" às "+String(x.ini).slice(0,5)+" foi aceita pela equipe do escritório Durão & Almeida, Pontes - Advogados Associados. Se precisar, estamos à disposição.";
      var url="https://wa.me/"+tel+"?text="+encodeURIComponent(texto);
      if(wa)wa.location.href=url;else window.location.href=url;
    }).catch(function(e){
      if(wa)wa.close();
      alert("Não foi possível aceitar: "+((e&&e.message)||e));
    });
  }
  function recusar(x){sb.from("solicitacoes").update({status:"recusada"}).eq("id",x.id).then(function(){load("sol");});}

  /* ---------- reunião ---------- */
  (function(){
    var o="";for(var m=START*60;m<END*60;m+=30)o+="<option>"+hhmm(m)+"</option>";$("rIni").innerHTML=o;
    $("rDur").innerHTML='<option value="30">30 minutos</option><option value="60">1 hora</option><option value="90">1h30</option><option value="120">2 horas</option>';
  })();
  function refreshReu(){
    var s=$("rCli"),v=s.value;s.textContent="";
    var o=el("option",null,S.cli.length?"Selecione…":"Cadastre um cliente");o.value="";s.appendChild(o);
    S.cli.slice().sort(byNome).forEach(function(c){var op=el("option",null,c.nome);op.value=c.id;s.appendChild(op);});
    s.value=v;
    var box=$("rAdvs"),sel=[].map.call(box.querySelectorAll("input:checked"),function(i){return i.value;});
    box.textContent="";
    S.adv.slice().sort(byNome).forEach(function(a){
      var l=el("label"),i=document.createElement("input");i.type="checkbox";i.value=a.id;i.checked=sel.indexOf(a.id)>-1;
      l.appendChild(i);l.appendChild(document.createTextNode(a.nome));box.appendChild(l);
    });
    conflito();
  }
  function lerReu(){
    return {
      id:editId,data:$("rData").value,ini:$("rIni").value,dur:+$("rDur").value,clienteId:$("rCli").value,
      assunto:$("rAssunto").value.trim(),tipo:$("rTipo").value,local:$("rLocal").value.trim(),pauta:$("rPauta").value,
      adv:[].map.call($("rAdvs").querySelectorAll("input:checked"),function(i){return i.value;})
    };
  }
  function conflito(){
    var r=lerReu(),s=mins(r.ini||"08:00"),e=s+r.dur,nomes=[];
    r.adv.forEach(function(id){
      var c=S.reu.some(function(o){
        if(o.id===r.id||o.data!==r.data||(o.adv||[]).indexOf(id)<0)return false;
        var os=mins(o.ini),oe=os+(+o.dur||30);return os<e&&oe>s;
      });
      if(c){var a=find("adv",id);if(a)nomes.push(a.nome);}
    });
    $("rAviso").textContent=nomes.length?"Atenção: conflito de horário para "+nomes.join(", ")+".":"";
  }
  function abrirReu(r,pre){
    if(!r&&!S.adv.length){abrirAdv();return;}
    if(!r&&!S.cli.length){abrirCli();return;}
    editId=r?r.id:null;pre=pre||{};
    $("tReu").textContent=r?"Editar reunião":"Nova reunião";
    var bx=$("rExcluir");bx.style.display=r?"":"none";bx.textContent="Excluir";delete bx.dataset.sure;
    confirmar(bx,"Confirmar exclusão",function(){del("reu",editId);$("dReu").close();});
    $("rFeito").style.display=r?"":"none";
    $("rFeito").textContent=r&&r.feito?"Reabrir":"Marcar como concluída";
    $("rAdvs").textContent="";$("rCli").textContent="";
    var src=r||{};
    refreshReu();
    $("rCli").value=src.clienteId||"";
    $("rAssunto").value=src.assunto||"";
    $("rData").value=src.data||cur;
    $("rIni").value=src.ini||pre.ini||"09:00";
    $("rDur").value=String(src.dur||30);
    $("rTipo").value=src.tipo||"cliente";
    $("rLocal").value=src.local||"";
    $("rPauta").value=src.pauta||"";
    var adv=src.adv||pre.adv||[];
    [].forEach.call($("rAdvs").querySelectorAll("input"),function(i){i.checked=adv.indexOf(i.value)>-1;});
    conflito();
    $("dReu").showModal();
  }
  $("fReu").addEventListener("input",conflito);
  $("fReu").addEventListener("change",conflito);
  $("fReu").addEventListener("submit",function(e){
    e.preventDefault();
    var r=lerReu();
    if(!r.adv.length){$("rAviso").textContent="Selecione pelo menos um advogado.";return;}
    if(editId){var o=find("reu",editId);r.feito=!!(o&&o.feito);}else r.feito=false;
    cur=r.data;save("reu",r);$("dReu").close();
  });
  $("rFeito").addEventListener("click",function(){
    var o=find("reu",editId);if(!o)return;
    var n=Object.assign({},o,{feito:!o.feito});save("reu",n);$("dReu").close();
  });
  $("rNovoCli").addEventListener("click",abrirCli);

  /* ---------- eventos gerais ---------- */
  [].forEach.call(document.querySelectorAll("[data-close]"),function(b){b.addEventListener("click",function(){b.closest("dialog").close();});});
  $("bSol").onclick=function(){listSol();$("dSol").showModal();};$("bAdv").onclick=abrirAdv;$("bCli").onclick=abrirCli;$("bNova").onclick=function(){abrirReu(null);};
  $("prev").onclick=function(){shift(-1);};$("next").onclick=function(){shift(1);};
  $("hoje").onclick=function(){cur=iso(new Date());render();};
  $("dia").addEventListener("change",function(){if(this.value){cur=this.value;render();}});

  /* ---------- login e inicialização ---------- */
  function entrar(){
    $("dLogin").close();$("bSair").style.display="";
    $("modo").textContent="Conectado ao Supabase.";
    Object.keys(NAMES).forEach(load);subscribe();
  }
  $("dLogin").addEventListener("cancel",function(e){e.preventDefault();});
  $("fLogin").addEventListener("submit",function(e){
    e.preventDefault();$("lErro").textContent="";
    sb.auth.signInWithPassword({email:$("lMail").value.trim(),password:$("lSenha").value}).then(function(r){
      if(r.error){$("lErro").textContent="E-mail ou senha incorretos.";return;}
      entrar();
    });
  });
  $("bSair").onclick=function(){sb.auth.signOut().then(function(){location.reload();});};
  if(!configurado){
    $("cal").innerHTML="";var m=el("div","empty","Configure SUPABASE_URL e SUPABASE_ANON_KEY no começo do script (veja o README).");$("cal").appendChild(m);
  }else{
    sb.auth.getSession().then(function(r){
      if(r.data&&r.data.session)entrar();else $("dLogin").showModal();
    });
  }
})();
</script>
</body>
</html>
